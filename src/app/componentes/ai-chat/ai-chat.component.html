<!-- FAB botón flotante -->
<button class="patry-fab" (click)="toggleChat()" [attr.aria-label]="isOpen ? 'Cerrar Patry' : 'Abrir Patry'">
  <svg class="patry-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Buns / antenas femeninas -->
    <circle cx="14" cy="7" r="4.5" fill="#12D7D0"/>
    <circle cx="26" cy="7" r="4.5" fill="#12D7D0"/>
    <!-- Cabeza -->
    <rect x="8" y="11" width="24" height="21" rx="8" fill="#0F2135" stroke="#12D7D0" stroke-width="1.5"/>
    <!-- Ojos -->
    <circle cx="15" cy="20" r="3.5" fill="#12D7D0"/>
    <circle cx="25" cy="20" r="3.5" fill="#12D7D0"/>
    <circle cx="15" cy="20" r="1.5" fill="white"/>
    <circle cx="25" cy="20" r="1.5" fill="white"/>
    <!-- Sonrisa -->
    <path d="M14 28 Q20 32 26 28" stroke="#12D7D0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </svg>
</button>

<!-- Panel de chat -->
<div class="patry-panel" *ngIf="isOpen">
  <!-- Header -->
  <div class="patry-header">
    <div class="patry-header-info">
      <svg class="patry-header-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="7" r="4.5" fill="#12D7D0"/>
        <circle cx="26" cy="7" r="4.5" fill="#12D7D0"/>
        <rect x="8" y="11" width="24" height="21" rx="8" fill="#0F2135" stroke="#12D7D0" stroke-width="1.5"/>
        <circle cx="15" cy="20" r="3.5" fill="#12D7D0"/>
        <circle cx="25" cy="20" r="3.5" fill="#12D7D0"/>
        <circle cx="15" cy="20" r="1.5" fill="white"/>
        <circle cx="25" cy="20" r="1.5" fill="white"/>
        <path d="M14 28 Q20 32 26 28" stroke="#12D7D0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <div>
        <span class="patry-name">Patry</span>
        <span class="patry-subtitle">Asistente de Exellssior</span>
      </div>
    </div>
    <button class="patry-close" (click)="toggleChat()" aria-label="Cerrar">×</button>
  </div>

  <!-- Mensajes -->
  <div class="patry-messages" #messagesContainer>
    <div
      *ngFor="let msg of messages"
      class="patry-bubble"
      [class.patry-bubble--user]="msg.role === 'user'"
      [class.patry-bubble--patry]="msg.role === 'patry'"
    >
      {{ msg.text }}
    </div>
    <div class="patry-loading" *ngIf="isLoading">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Input -->
  <div class="patry-input-row">
    <textarea
      class="patry-input"
      [(ngModel)]="question"
      (keydown)="onKeydown($event)"
      placeholder="Haceme una pregunta..."
      rows="1"
      [disabled]="isLoading"
    ></textarea>
    <button
      class="patry-send"
      (click)="sendMessage()"
      [disabled]="!question.trim() || isLoading"
      aria-label="Enviar"
    >
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>
